# ==============================================================================
# GenZ Fits (VÉLORA) — Grafana Data Source Provisioning
# Automatically registers Prometheus as the default data source.
# ==============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s
      httpMethod: POST
